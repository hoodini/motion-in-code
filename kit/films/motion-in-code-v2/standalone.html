<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>Motion in Code — film (magazine cut)</title>
<!--FONTS--><link href="https://fonts.googleapis.com/css2?family=Anton&family=Assistant:wght@600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Rubik:wght@700;800;900&display=block" rel="stylesheet"><!--/FONTS-->
<style>html,body{margin:0;background:#0B0B10;overflow:hidden}canvas{display:block}</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
/* =====================================================================
   MOTION IN CODE — magazine cut. One pure function of time.
   Art direction: YUV.AI brand — full-bleed colour spreads (ink / cyan /
   magenta) that change on the downbeat of every bar, giant Anton folio
   numerals, Rubik 900 headlines anchored right, Anton decks.
   Track: Mixkit "Cat Walk" (Arulo), 129.723 BPM, drop on film beat 12.
   ===================================================================== */
const Q = new URLSearchParams(location.search);
const BPM = 129.723, B = 60 / BPM, bt = k => k * B, NB = 56, DUR = NB * B + 0.8;
/* brand themes: K = base page/ink, M = signature accent (also the accent page), C = secondary page */
const THEMES = {
  ink:    { K: '#0B0B10', M: '#FF2EA0', C: '#16D6E8' },
  navy:   { K: '#0A1838', M: '#FF2EA0', C: '#38B6FF' },
  purple: { K: '#0B0B10', M: '#7B2CFF', C: '#16D6E8' },
  lime:   { K: '#0A0A0A', M: '#C6FF00', C: '#FFFFFF' },
  /* from Yuval's own look: navy tee + light denim + the phoenix's colours */
  phoenix:  { K: '#12163F', M: '#FF8F3A', C: '#AFCBEF', pages: { M: { grad: ['#FFC74E', '#FF8F3A', '#F56B49'], hd: '#12163F', sb: '#12163F', band: '#FFFFFF' }, K: { sb: '#FFC74E', chip: '#FF8F3A', band: '#FF8F3A', num: '#FF8F3A' }, C: { band: '#FF8F3A' } } },
  spectrum: { K: '#12163F', M: '#FF66C4', C: '#5DE4E9', pages: { M: { grad: ['#F56B49', '#D74270', '#7B3FA8'], hd: '#FFFFFF', sb: '#FFFFFF', band: '#FFC74E' }, K: { sb: '#5DE4E9', chip: '#D74270', band: '#F56B49', num: '#D74270' } } }
};
const TH = THEMES[Q.get('theme') || 'ink'];
const K = TH.K, W = '#FFFFFF', M = TH.M, C = TH.C;
let PAL; /* a "spread" = one page of the magazine: background + the colours that live on it (built once helpers exist) */
const SEC = [
  { t: 0, p: 'K' },
  { t: bt(4), p: 'K', num: '$15K' },         // the price rises behind the headline on its first word
  { t: bt(8), p: 'C', wipe: 'r', num: 'CODE' },
  { t: bt(12) + 0.36, p: 'M' },             // hidden under the drop flood
  { t: bt(16), p: 'K', num: '01' },          // revealed by the flood contracting into the button
  { t: bt(20), p: 'C', wipe: 'b', num: '02' },
  { t: bt(24), p: 'K', wipe: 'r', num: '03' },
  { t: bt(28), p: 'M', wipe: 'b', num: '04' },
  { t: bt(32), p: 'K', wipe: 'r', num: '05' },
  { t: bt(36), p: 'C', wipe: 'b', num: '06' },
  { t: bt(40), p: 'K', wipe: 'r', num: '07' },
  { t: bt(44), p: 'M', wipe: 'b', num: 'SPEC' },
  { t: bt(50), p: 'C' }                       // hidden under the ink, revealed as it contracts
];
const LAYOUTS = {
  h: { name: 'h', W: 1920, H: 1080, cx: 960, cy: 655, S: 1, right: 1800, tY: 262, tSize: 150, tMax: 1700, subY: 334, subSize: 40, chipY: 112, hudY: 1046, wmY: 540, numSize: 1250, numX: -40 },
  v: { name: 'v', W: 1080, H: 1920, cx: 540, cy: 1070, S: 0.98, right: 1015, tY: 600, tSize: 124, tMax: 950, subY: 668, subSize: 32, chipY: 440, hudY: 1862, wmY: 880, numSize: 1100, numX: -50 }
};
const L0 = LAYOUTS[Q.get('L') || 'h'];
const SCALE = +(Q.get('scale') || 1);
const cv = document.getElementById('c'); cv.width = Math.round(L0.W * SCALE); cv.height = Math.round(L0.H * SCALE);

/* ---------------- motion math (closed-form, pure) ---------------- */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, u) => a + (b - a) * u;
const inv = (a, b, x) => clamp((x - a) / (b - a));
const out3 = u => 1 - Math.pow(1 - u, 3), in3 = u => u * u * u, io3 = u => (u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2);
const logLerp = (a, b, u) => a * Math.pow(b / a, u);
function spring(t, w = 12, z = 0.8) {
  if (t <= 0) return 0;
  if (z < 1) { const wd = w * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + (z * w / wd) * Math.sin(wd * t)); }
  return 1 - Math.exp(-w * t) * (1 + w * t);
}
function sk(t, keys, w = 12, z = 0.8) { let v = keys[0][1]; for (let i = 1; i < keys.length; i++) v += (keys[i][1] - keys[i - 1][1]) * spring(t - keys[i][0], w, z); return v; }
function hex(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function toHex(a) { return '#' + a.map(v => Math.round(v).toString(16).padStart(2, '0')).join(''); }
function mix(a, b, u) { const A = hex(a), Bc = hex(b); u = clamp(u); return toHex(A.map((v, i) => lerp(v, Bc[i], u))); }
const tr = (a, b, t0, t, d = 0.3) => mix(a, b, inv(t0, t0 + d, t));
function rnd(i) { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
function secIdx(t) { let i = 0; for (let k = 1; k < SEC.length; k++) if (t >= SEC[k].t) i = k; return i; }
function lum(h) { const [r, g, b] = hex(h).map(v => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }); return 0.2126 * r + 0.7152 * g + 0.0722 * b; }
const on = bg => (lum(bg) > 0.45 ? K : W);
PAL = {
  K: { bg: K, hd: W, sb: C, chip: M, band: M, num: M, numMode: 'stroke' },
  C: { bg: C, hd: on(C), sb: on(C), chip: K, band: M, num: mix(C, K, 0.13), numMode: 'fill' },
  M: { bg: M, hd: on(M), sb: K, chip: K, band: W, num: mix(M, K, 0.13), numMode: 'fill' }
};
for (const k in (TH.pages || {})) Object.assign(PAL[k], TH.pages[k]);
if (PAL.M.grad) PAL.M.bg = PAL.M.grad[1];
function pagePaint(x, L, P) { if (!P.grad) return P.bg; const g = x.createLinearGradient(0, 0, L.W, L.H); P.grad.forEach((c, j) => g.addColorStop(j / (P.grad.length - 1), c)); return g; }
function palTr(key, t) { const i = secIdx(t), s = SEC[i], P = PAL[s.p]; if (i > 0 && t < s.t + 0.35) return mix(PAL[SEC[i - 1].p][key], P[key], inv(s.t, s.t + 0.35, t)); return P[key]; }

/* ---------------- drawing helpers ---------------- */
const FT = {
  he: s => `900 ${s}px Rubik, Assistant, sans-serif`, he8: s => `800 ${s}px Rubik, Assistant, sans-serif`,
  en: s => `400 ${s}px Anton, Impact, sans-serif`, mono: s => `500 ${s}px "JetBrains Mono", ui-monospace, monospace`, monoB: s => `700 ${s}px "JetBrains Mono", ui-monospace, monospace`
};
function rr(x, X, Y, w, h, r) { r = Math.max(0, Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2)); x.beginPath(); x.moveTo(X + r, Y); x.arcTo(X + w, Y, X + w, Y + h, r); x.arcTo(X + w, Y + h, X, Y + h, r); x.arcTo(X, Y + h, X, Y, r); x.arcTo(X, Y, X + w, Y, r); x.closePath(); }
function rrc(x, cx, cy, w, h, r) { rr(x, cx - w / 2, cy - h / 2, w, h, r); }
function circle(x, cx, cy, r) { x.beginPath(); x.arc(cx, cy, Math.max(0, r), 0, Math.PI * 2); }
function fitSize(x, text, fontFn, size, maxW) { x.font = fontFn(size); const w = x.measureText(text).width; return w > maxW ? size * maxW / w : size; }
/* words rise out of a mask line, one by one; leave through the same line.
   opt.right anchors the line's right edge (Hebrew-first layout); opt.colors colours word by word */
function riseWords(x, t, words, cxp, y, size, fontFn, color, tIns, tOut, opt = {}) {
  if (t < Math.min(...tIns)) return;
  if (tOut != null && t > tOut + 0.4) return;
  x.save(); x.font = fontFn(size); x.direction = opt.ltr ? 'ltr' : 'rtl';
  if (opt.spacing) x.letterSpacing = opt.spacing;
  const gap = size * (opt.gap ?? 0.27), ws = words.map(w => x.measureText(w).width), total = ws.reduce((a, b) => a + b, 0) + gap * (words.length - 1);
  if (opt.right != null) cxp = opt.right - total / 2;
  x.beginPath(); x.rect(-1e4, y - size * 1.05, 3e4, size * 1.42); x.clip();
  let pos = opt.ltr ? cxp - total / 2 : cxp + total / 2;
  words.forEach((w, i) => {
    const ti = tIns[i];
    if (t >= ti) {
      let dy = size * 1.25 * (1 - out3(inv(ti, ti + (opt.dur || 0.34), t)));
      if (tOut != null) dy += size * 1.5 * in3(inv(tOut + i * 0.025, tOut + 0.27 + i * 0.025, t));
      const xr = opt.ltr ? pos : pos - ws[i];
      if (opt.marker && opt.marker.i === i) {
        const m = opt.marker, mw = (ws[i] + size * 0.24) * out3(inv(m.t, m.t + 0.32, t));
        if (mw > 0) { x.fillStyle = m.color || M; x.fillRect(xr + ws[i] + size * 0.12 - mw, y + dy - size * 0.78, mw, size * 0.92); }
      }
      x.fillStyle = opt.colors ? opt.colors[i] : color; x.textAlign = 'left'; x.fillText(w, xr, y + dy);
    }
    pos += opt.ltr ? ws[i] + gap : -(ws[i] + gap);
  });
  x.restore();
}
function cursor(x, X, Y, s) {
  x.save(); x.translate(X, Y); x.scale(s, s); x.beginPath(); x.moveTo(0, 0); x.lineTo(0, 44); x.lineTo(11, 34); x.lineTo(20, 53); x.lineTo(28, 50); x.lineTo(19, 31); x.lineTo(34, 31); x.closePath();
  x.lineJoin = 'round'; x.lineWidth = 3.2; x.strokeStyle = W; x.stroke(); x.fillStyle = K; x.fill(); x.restore();
}

/* ---------------- the page: colour spreads that wipe in on the downbeat ---------------- */
const WIPE = 0.35, BAND = 0.07;
function clipWipe(x, L, dir, u) { x.beginPath(); if (dir === 'r') x.rect(L.W * (1 - u), 0, L.W * u + 1, L.H); else x.rect(0, L.H * (1 - u), L.W, L.H * u + 1); x.clip(); }
function layer(x, t, L, i) {
  const s = SEC[i], P = PAL[s.p];
  if (P.grad) { const g = x.createLinearGradient(0, 0, L.W, L.H); P.grad.forEach((c, j) => g.addColorStop(j / (P.grad.length - 1), c)); x.fillStyle = g; } else x.fillStyle = P.bg;
  x.fillRect(0, 0, L.W, L.H);
  if (!s.num) return;
  const size = L.numSize, a = t - s.t, rise = spring(a, 9, 0.86);
  x.save(); x.font = FT.en(size); x.direction = 'ltr'; x.textAlign = 'left';
  let X = L.numX - a * 14, Y = L.H + size * 0.1 + (1 - rise) * size * 0.85;
  if (L.name === 'v' && s.num.length > 2) { // vertical spread: the word reads bottom-to-top along the left edge
    const vs = 640; x.font = FT.en(vs); x.translate(vs * 0.66, L.H - 40 + (1 - rise) * 1300 - a * 14); x.rotate(-Math.PI / 2); X = 0; Y = 0;
  }
  if (P.numMode === 'stroke') { x.lineWidth = 5; x.strokeStyle = P.num; x.strokeText(s.num, X, Y); } else { x.fillStyle = P.grad ? 'rgba(0,0,0,.09)' : P.num; x.fillText(s.num, X, Y); }
  x.restore();
}
function background(x, t, L) {
  const i = secIdx(t), s = SEC[i];
  if (s.wipe && t < s.t + WIPE + BAND) {
    layer(x, t, L, i - 1);
    const u1 = out3(inv(s.t, s.t + WIPE, t)), u2 = out3(inv(s.t + BAND, s.t + BAND + WIPE, t));
    if (u1 > 0) { x.save(); clipWipe(x, L, s.wipe, u1); x.fillStyle = PAL[s.p].band; x.fillRect(0, 0, L.W, L.H); x.restore(); }
    if (u2 > 0) { x.save(); clipWipe(x, L, s.wipe, u2); layer(x, t, L, i); x.restore(); }
  } else layer(x, t, L, i);
}

/* ---------------- shared scene geometry ---------------- */
const CODE = [
  { pre: 'function ', mid: 'seek(t)', post: ' {', a: bt(8.5), b: bt(8.85) },
  { txt: '  dot.w = spring(t - 0.5)', a: bt(9.0), b: bt(9.45) },
  { txt: '  cam.z = logLerp(1, 4, t)', a: bt(9.5), b: bt(9.95) },
  { txt: '  return paint(t)', a: bt(10.0), b: bt(10.25) },
  { txt: '}', a: bt(10.3), b: bt(10.35) }
];
const CARD = { cx: 0, cy: 30, w: 900, h: 430 }, CODE_FS = 34, CODE_LH = 58, CODE_X = -390, CODE_Y0 = -112;
let TGLYPH = { x: 0, y: 0 }, LABEL_TO = { x: 0, y: 0 };
function measureCode(x) {
  x.font = FT.monoB(CODE_FS);
  const pre = x.measureText('function ').width, mid = x.measureText('seek(t)').width, se = x.measureText('seek(').width, tw = x.measureText('t').width;
  LABEL_TO = { x: CODE_X + pre + mid / 2, y: CODE_Y0 };
  TGLYPH = { x: CODE_X + pre + se + tw / 2, y: CODE_Y0 - CODE_FS * 0.36 };
}
const TOK = /(\s+|[A-Za-z_]+|\d+(?:\.\d+)?|.)/g;
function drawCodeLine(x, s, X, Y) {
  let cx = X; const parts = s.match(TOK) || [];
  for (const p of parts) {
    x.fillStyle = /^(function|return)$/.test(p) ? C : (p === 't' || /^\d/.test(p)) ? M : W;
    x.fillText(p, cx, Y); cx += x.measureText(p).width;
  }
  return cx;
}
const FILMS = [354, 118, -118, -354], FW = 210, FHt = 150, FY = 30;
const PANEL = { w: 1000, h: 560 };
const WH = { len: 300, peakU: 0.308 }; // whoosh_air: peak at 0.716 s of 2.32 s (measured)
const PILLS = ['<inputs>', '<direction>', '<structure>', '<build>', '<gotchas>', '<start>'];
const THUMB_T = [bt(1.4), bt(6.7), bt(10.2), bt(12.4), bt(15.2), bt(19.3), bt(23.5), bt(27.4), bt(30.6), bt(34.2), bt(36.6), bt(38.5)];

/* ---------------- the camera ---------------- */
function cam(t) {
  if (t >= bt(10.25) && t < bt(12) + 0.42) { const u = io3(inv(bt(10.25), bt(12), t)); return { z: logLerp(1, 3.2, u), fx: lerp(0, TGLYPH.x, u), fy: lerp(0, TGLYPH.y, u) }; }
  if (t >= bt(32.7) && t < bt(35.5)) { const u = io3(inv(bt(32.7), bt(35.5), t)); return { z: logLerp(1, 16, u), fx: 0, fy: 0 }; }
  return { z: 1, fx: 0, fy: 0 };
}
function coverR(L, ox, oy) { return Math.max(...[[0, 0], [L.W, 0], [0, L.H], [L.W, L.H]].map(([a, b]) => Math.hypot(a - ox, b - oy))) * 1.03; }

/* =========================== ACT 1 =========================== */
function act1(x, t, L) {
  if (t >= bt(12) + 0.42) return;
  // the dot -> pill -> code card (one object, never cut)
  const w = sk(t, [[-1, 0], [0, 76], [bt(1), 430], [bt(8), CARD.w]], 13, 0.78);
  const h = sk(t, [[-1, 0], [0, 76], [bt(1), 112], [bt(8), CARD.h]], 13, 0.78);
  const cy = sk(t, [[-1, 0], [bt(8), CARD.cy]], 12, 0.85);
  const r = t < bt(8) ? h / 2 : lerp(h / 2, 0, io3(inv(bt(8), bt(8.45), t)));
  if (w > 0.5) {
    rrc(x, 0, cy, w, h, r); x.fillStyle = tr(M, K, bt(8), t, 0.3); x.fill();
    if (t > bt(1.2)) {
      x.save(); rrc(x, 0, cy, w, h, r); x.clip();
      const u = io3(inv(bt(8), bt(8.45), t));
      const fs = lerp(50, CODE_FS, u), lx = lerp(0, LABEL_TO.x, u), ly = lerp(17, LABEL_TO.y, u);
      const dy = 70 * (1 - out3(inv(bt(1.2), bt(1.2) + 0.34, t)));
      x.font = FT.monoB(fs); x.direction = 'ltr'; x.textAlign = 'center'; x.fillStyle = W;
      if (u < 1) x.fillText('seek(t)', lx, ly + dy);
      else { x.textAlign = 'left'; const s = x.measureText('seek(t)').width; drawCodeLine(x, 'seek(t)', lx - s / 2, ly); }
      x.restore();
    }
    if (t > bt(8.4)) {
      x.save(); rrc(x, 0, cy, w, h, r); x.clip(); x.font = FT.monoB(CODE_FS); x.direction = 'ltr'; x.textAlign = 'left';
      let caret = null;
      CODE.forEach((ln, i) => {
        const y = CODE_Y0 + i * CODE_LH, u = inv(ln.a, ln.b, t);
        if (t < ln.a) return;
        if (i === 0) {
          const pre = ln.pre.slice(0, Math.round(ln.pre.length * clamp(u * 1.6)));
          const preW = x.measureText(ln.pre).width;
          const preEnd = drawCodeLine(x, pre, CODE_X, y); if (u < 0.6) caret = [preEnd, y];
          const post = ln.post.slice(0, Math.round(ln.post.length * clamp((u - 0.6) / 0.4)));
          const endX = drawCodeLine(x, post, CODE_X + preW + x.measureText(ln.mid).width, y);
          if (u >= 0.6 && u < 1) caret = [endX, y];
        } else {
          const s = ln.txt.slice(0, Math.round(ln.txt.length * u)); const endX = drawCodeLine(x, s, CODE_X, y); if (u < 1) caret = [endX, y];
        }
      });
      if (caret) { x.fillStyle = M; x.fillRect(caret[0] + 3, caret[1] - CODE_FS * 0.78, 5, CODE_FS * 0.95); }
      x.restore();
    }
  }
  if (t > bt(2) && t < bt(8.2)) riseWords(x, t, [`t = ${t.toFixed(3)}`], 0, 140, 38, FT.monoB, C, [bt(2)], bt(7.7), { ltr: true });
}
function act1Screen(x, t, L) {
  const hw = ['סטודיו', 'גובה', '‎$15,000', 'לסרטון השקה.'];
  const s1 = fitSize(x, hw.join(' '), FT.he, L.tSize, L.tMax);
  riseWords(x, t, hw, 0, L.tY, s1, FT.he, W, [bt(4), bt(5), bt(6), bt(7)], bt(7.72), { marker: { i: 2, t: bt(6.35) }, right: L.right });
  riseWords(x, t, ['WHAT A STUDIO CHARGES FOR ONE LAUNCH VIDEO'], 0, L.subY, L.subSize, FT.en, C, [bt(4.25)], bt(7.72), { ltr: true, right: L.right, spacing: '2px' });
  const tw = ['Claude', 'כותב', 'את', 'זה', 'בקוד.'];
  const s2 = fitSize(x, tw.join(' '), FT.he, L.tSize, L.tMax);
  riseWords(x, t, tw, 0, L.tY, s2, FT.he, K, tw.map((_, i) => bt(8) + i * 0.06), bt(10.05), { right: L.right });
  riseWords(x, t, ['EVERY SINGLE FRAME OF THIS IS CODE'], 0, L.subY, L.subSize, FT.en, K, [bt(8.45)], bt(10.05), { ltr: true, right: L.right, spacing: '2px' });
}
/* the drop: the magenta "t" floods the frame */
function dropScreen(x, t, L) {
  if (t < bt(12) || t > bt(16.5)) return;
  const R0 = coverR(L, L.cx, L.cy);
  if (t < bt(16)) { circle(x, L.cx, L.cy, R0 * out3(inv(bt(12), bt(12) + 0.35, t))); x.fillStyle = pagePaint(x, L, PAL.M); x.fill(); }
  const Wd = ['וידאו', 'שהוא', 'קוד.'], T = [bt(13), bt(14), bt(15)], tOut = bt(15.72), cols = [PAL.M.hd, PAL.M.hd, PAL.M.hd === W ? K : W];
  if (L.name === 'h') { const sz = fitSize(x, Wd.join(' '), FT.he, 320, 1720); riseWords(x, t, Wd, L.W / 2, L.H / 2 + 140, sz, FT.he, W, T, tOut, { colors: cols }); }
  else Wd.forEach((w, i) => riseWords(x, t, [w], L.W / 2, 860 + i * 290, 280, FT.he, cols[i], [T[i]], tOut));
  riseWords(x, t, ['THE @TWOCLIPPING METHOD  ·  OPUS 5.5  ·  0 AFTER EFFECTS'], L.W / 2, L.name === 'h' ? L.H / 2 - 170 : 560, L.name === 'h' ? 44 : 32, FT.en, K, [bt(12.5)], tOut, { ltr: true, spacing: '2px' });
}

/* =========================== ACT 2: the seven rules =========================== */
const BTN = { x: 0, y: 150 }; const LBL_CX = tw => 330 - tw / 2;
function cardBars(x, t, cy, times, sc = 1, ox = 0, cols = [K, M, C]) {
  const right = ox + 330 * sc, rows = [[0, 520, cols[0], 30], [1, 380, cols[1], 24], [2, 460, cols[2], 24]];
  rows.forEach(([i, len, col, hh]) => { const l = len * sc * out3(inv(times[i], times[i] + 0.34, t)); if (l <= 0) return; rrc(x, right - l / 2, cy - 40 * sc + i * 60 * sc, l, hh * sc, 999); x.fillStyle = col; x.fill(); });
}
function rule1(x, t, L) { // no fades: things change shape
  if (t < bt(16.4) || t > bt(20.6)) return;
  const pw = sk(t, [[-1, 84], [bt(16.45), 290], [bt(18), 760]], 13, 0.8);

  const p = spring(t - bt(52.45), 13, 0.82), pulse = sk(t, [[-1, 1], [bt(55), 1.35], [bt(55) + 0.12, 1]], 24, 0.6);
  const letters = []; let acc = left; for (const ch of A) { const w = x.measureText(ch).width; letters.push([ch, acc + w / 2]); acc += w; }
  acc = dX + rp + gap; for (const ch of Bs) { const w = x.measureText(ch).width; letters.push([ch, acc + w / 2]); acc += w; }
  letters.forEach(([ch, fx], i) => { const j = i < 3 ? 2 - i : i - 3, s = spring(t - (bt(52.55) + j * 0.05), 13, 0.78); if (s <= 0.002) return;
    x.save(); x.translate(lerp(dX, fx, s), yb); x.scale(s, s); x.fillStyle = K; x.textAlign = 'center'; x.fillText(ch, 0, 0); x.restore(); });
  circle(x, lerp(L.W / 2, dX, p), lerp(L.wmY - 24, dY, p), lerp(40, rp, p) * pulse); x.fillStyle = M; x.fill();
  x.restore();
  // magazine rules above and below the masthead
  const rw = (L.name === 'h' ? 1240 : 900) * out3(inv(bt(53), bt(53.5), t));
  if (rw > 0) { x.fillStyle = K; x.fillRect(L.W / 2 - rw / 2, yb - size * 0.86, rw, 8); x.fillRect(L.W / 2 - rw / 2, yb + size * 0.17, rw, 8); }
  riseWords(x, t, ['FLY HIGH WITH AI'], L.W / 2, yb + (L.name === 'h' ? 130 : 110), L.name === 'h' ? 54 : 44, FT.en, K, [bt(53.5)], null, { ltr: true, spacing: '14px', gap: 0 });
  const cred = L.name === 'h' ? [['METHOD: @TWOCLIPPING   ·   FULL BREAKDOWN: HOODINI.GITHUB.IO/MOTION-IN-CODE']] : [['METHOD: @TWOCLIPPING'], ['HOODINI.GITHUB.IO/MOTION-IN-CODE']];
  cred.forEach((c, i) => riseWords(x, t, c, L.W / 2, (L.name === 'h' ? L.H - 110 : L.H - 300) + i * 52, L.name === 'h' ? 30 : 34, FT.en, K, [bt(54) + i * 0.08], null, { ltr: true, spacing: '2px' }));
}

/* =========================== kicker + HUD =========================== */
const RULES = [16, 20, 24, 28, 32, 36, 40];
const RULE_TITLES = [
  [['לא', 'פייד.', 'שינוי', 'צורה.'], 'OBJECTS CHANGE SHAPE INSTEAD'],
  [['בלי', 'קאטים.'], 'EVERY SCENE IS MADE OUT OF THE LAST ONE'],
  [['משהו', 'קורה', 'על', 'כל', 'ביט.'], 'SOMETHING HAPPENS ON EVERY BEAT'],
  [['קפיץ', 'קטן', 'בכל', 'נחיתה.'], 'SPRINGS EVERYWHERE · A TINY OVERSHOOT'],
  [['תנועת', 'מצלמה', 'אחת.'], 'ZOOM INTERPOLATED IN LOG SPACE'],
  [['סאונד', 'אמיתי.', 'על', 'השיא.'], 'ITS MEASURED PEAK, NOT ITS FILE START'],
  [['קלוד', 'בודק', 'את', 'עצמו.'], 'CHECK EVERY FRAME BEFORE YOU SHOW ME'],
];
function rulesScreen(x, t, L) {
  RULES.forEach((b, i) => {
    const P = PAL[SEC[secIdx(bt(b) + 0.5)].p];
    const [ws, sub] = RULE_TITLES[i], size = fitSize(x, ws.join(' '), FT.he, L.tSize, L.tMax);
    riseWords(x, t, ws, 0, L.tY, size, FT.he, P.hd, ws.map((_, j) => bt(b) + j * 0.06), bt(b + 3.72), { right: L.right });
    riseWords(x, t, [sub], 0, L.subY, L.subSize, FT.en, P.sb, [bt(b) + 0.22], bt(b + 3.72), { ltr: true, right: L.right, spacing: '2px' });
  });
  const ws = ['מפרט', 'של', 'במאי.', 'לא', 'בקשה.'], size = fitSize(x, ws.join(' '), FT.he, L.tSize, L.tMax);
  riseWords(x, t, ws, 0, L.tY, size, FT.he, PAL.M.hd, ws.map((_, j) => bt(44) + j * 0.06), bt(47.72), { right: L.right });
  riseWords(x, t, ['INPUTS · DIRECTION · STRUCTURE · BUILD · GOTCHAS · START'], 0, L.subY, L.subSize, FT.en, K, [bt(44.2)], bt(47.72), { ltr: true, right: L.right, spacing: '2px' });
  // the kicker: one chip for all seven rules (its number rolls) + a rule line to the margin
  if (t > bt(16) && t < bt(44.2)) {
    const s = spring(t - bt(16), 14, 0.75) * (1 - spring(t - bt(43.75), 14, 0.9)); if (s < 0.01) return;
    const idx = clamp(Math.floor((t - bt(16)) / (4 * B)), 0, 6), w = 210, h = 64, cxc = L.right - w / 2;
    const lineR = L.right - w - 28, lineL = L.W - L.right, grow = out3(inv(bt(16) + 0.1, bt(16) + 0.55, t)) * (1 - in3(inv(bt(43.55), bt(43.85), t)));
    if (grow > 0) { x.fillStyle = palTr('hd', t); x.fillRect(lineR - (lineR - lineL) * grow, L.chipY - 3, (lineR - lineL) * grow, 6); }
    x.save(); x.translate(cxc, L.chipY); x.scale(s, s); rrc(x, 0, 0, w, h, 999); x.fillStyle = palTr('chip', t); x.fill();
    rrc(x, 0, 0, w, h, 999); x.clip(); x.font = FT.en(40); x.direction = 'ltr'; x.textAlign = 'center';
    const rs = bt(RULES[idx]), roll = out3(inv(rs, rs + 0.3, t));
    x.fillStyle = on(palTr('chip', t)); x.fillText(`0${idx + 1}  /  07`, 0, 15 + 56 * (1 - roll));
    if (idx > 0 && roll < 1) x.fillText(`0${idx}  /  07`, 0, 15 - 56 * roll);
    x.restore();
  }
}
function hud(x, t, L) {
  let col = palTr('sb', t);
  if (t > bt(12) + 0.3 && t < bt(16)) col = K;
  if (t > bt(49.0) && t < bt(52.3)) col = C;
  x.save(); x.fillStyle = col; x.direction = 'ltr';
  x.font = FT.monoB(L.name === 'h' ? 21 : 23); x.textAlign = 'left';
  x.fillText(`seek(${t.toFixed(3)})  ·  beat ${Math.min(NB, Math.floor(t / B))}/${NB}  ·  ${BPM.toFixed(1)} BPM`, L.name === 'h' ? 40 : 44, L.hudY);
  if (L.name === 'h') { x.font = FT.en(26); x.letterSpacing = '3px'; x.textAlign = 'right'; x.fillText('MOTION IN CODE  ·  YUV.AI', L.W - 40, L.hudY); }
  x.restore();
}

/* =========================== the film =========================== */
function drawFilm(x, t, L) {
  const k = x.canvas.width / L.W; x.setTransform(k, 0, 0, k, 0, 0);
  background(x, t, L);
  const c = cam(t);
  x.save(); x.translate(L.cx, L.cy); x.scale(L.S * c.z, L.S * c.z); x.translate(-c.fx, -c.fy);
  act1(x, t, L); rule1(x, t, L); rule2(x, t, L); rule3(x, t, L); rule4(x, t, L); rule5(x, t, L, c); rule6(x, t, L); rule7(x, t, L); act3(x, t, L);
  x.restore();
  dropScreen(x, t, L);
  if (t >= bt(16) && t < bt(16.45)) {
    const u = io3(inv(bt(16), bt(16.45), t)), R0 = coverR(L, L.cx, L.cy), bx = L.cx, by = L.cy + BTN.y * L.S;
    circle(x, lerp(L.cx, bx, u), lerp(L.cy, by, u), logLerp(R0, 42 * L.S, u)); x.fillStyle = pagePaint(x, L, PAL.M); x.fill();
  }
  act3Screen(x, t, L);
  if (!((t > bt(12) + 0.3 && t < bt(16.1)) || (t > bt(49.0) && t < bt(52.2)))) { act1Screen(x, t, L); rulesScreen(x, t, L); }
  endCard(x, t, L);
  hud(x, t, L);
}

/* ---------------- render API ---------------- */
const ctx = cv.getContext('2d');
const scratch = document.createElement('canvas'); scratch.width = cv.width; scratch.height = cv.height; const sctx = scratch.getContext('2d');
window.seek = t => drawFilm(ctx, t, L0);
window.renderFrame = (t, n = 6, shutter = 0.5, fps = 60) => {
  if (n <= 1) { drawFilm(ctx, t, L0); return; }
  const span = shutter / fps;
  for (let i = 0; i < n; i++) {
    const ts = Math.max(0, t - span / 2 + span * (i + 0.5) / n);
    drawFilm(sctx, ts, L0);
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1 / (i + 1); ctx.drawImage(scratch, 0, 0); ctx.globalAlpha = 1;
  }
};
window.FILM = { B, BPM, NB, DUR, bt, layout: L0.name, W: L0.W, H: L0.H };
window.__ready = (async () => {
  const faces = ['900 100px Rubik', '800 40px Rubik', '400 100px Anton', '500 30px "JetBrains Mono"', '700 30px "JetBrains Mono"'];
  await Promise.all(faces.map(f => document.fonts.load(f, 'אבג abc ‎$15,000 ζ ✓')));
  await document.fonts.ready;
  measureCode(ctx);
  for (let k = 0; k < 12; k++) thumb(L0, k);
  drawFilm(ctx, 0, L0);
  return true;
})();
