<style>
*{box-sizing:border-box}html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:linear-gradient(180deg,#5EA9F2 0%,#93CBFF 45%,#DDF0FF 100%);font-family:Assistant,sans-serif;position:relative}
.wall{position:absolute;left:-60px;top:-40px;width:760px;height:720px;display:grid;grid-template-columns:repeat(3,240px);gap:14px;transform:rotate(-8deg);transform-origin:center}
.wall img{width:240px;aspect-ratio:16/9;object-fit:cover;border-radius:16px;border:5px solid #12163F;box-shadow:0 14px 30px -10px rgba(5,8,30,.5);display:block}

h1 .hl{background:linear-gradient(135deg,#FFC74E,#FF8F3A 50%,#F56B49);padding:.05em .12em 0;border-radius:.1em;display:inline-block;line-height:.86}
.deck{font:700 34px/1.2 Karantina;margin:0 0 22px}
.st{display:flex;gap:10px;justify-content:flex-start}
.st div{background:rgba(255,255,255,.88);border-radius:16px;padding:8px 16px 6px;box-shadow:0 6px 18px -6px rgba(5,8,30,.38)}
.st b{display:block;font:400 40px/1 Anton;direction:ltr;text-align:right}.st span{font:700 18px/1.2 Karantina;color:#3B4472}
.wm{position:absolute;right:56px;bottom:34px;font:400 30px/1 Anton;color:#12163F;direction:ltr}.wm i{color:#FF8F3A;font-style:normal}
